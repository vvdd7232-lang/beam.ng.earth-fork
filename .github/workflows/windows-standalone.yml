name: Windows standalone build
on:
  push:
    branches: [arena/e2f01e64-beam-ng-earth-fork]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  launcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Launcher and settings regression tests
        run: >-
          python -m unittest
          server.tests.test_launcher_linux.StandaloneStartTest
          server.tests.test_launcher_linux.WindowsTasklist
          server.tests.test_launcher_linux.GameClosed
          server.tests.test_launcher_linux.GfxArgTest
          server.tests.test_launcher_linux.WaitForGameTest
          server.tests.test_apppaths
          server.tests.test_launcher_linux.GpuPlan
          server.tests.test_launcher_linux.CacheDirTest -q
  windows:
    needs: launcher-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build native kernels
        run: python tools/build_native.py
      - name: Install Python packages
        run: python -m pip install pyinstaller -r server/requirements.txt
      - name: Check native module version
        run: python -c "import sys; sys.path.insert(0, 'server'); import fast; fast.require(fast.MIN_VERSION, 'Windows CI')"
      - name: Windows launcher regression tests
        run: >-
          python -m unittest
          server.tests.test_launcher_linux.StandaloneStartTest
          server.tests.test_launcher_linux.WindowsTasklist
          server.tests.test_launcher_linux.GameClosed
          server.tests.test_launcher_linux.GfxArgTest
          server.tests.test_launcher_linux.WaitForGameTest -q
      - name: Build executable
        run: python tools/build_app.py --stock-bootloader
      - name: Test packaged server
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/BeamNG.Earth-*.exe | Select-Object -First 1
          & $exe.FullName --server --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-Windows-standalone
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
